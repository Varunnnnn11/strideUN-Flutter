<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraRun</title>
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; background: #080c14; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
    .overlay {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(8,12,20,0.92);
      border: 1px solid rgba(255,45,120,0.3);
      border-radius: 16px;
      padding: 12px 24px;
      color: white;
      font-family: sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: bold;
      z-index: 1;
    }
    .btn {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #FF2D78;
      color: white;
      border: none;
      border-radius: 32px;
      padding: 18px 60px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      cursor: pointer;
      z-index: 1;
      font-family: sans-serif;
    }
    .btn:hover { background: #CC1144; }
    .zone-popup {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,45,120,0.15);
      border: 1px solid rgba(255,45,120,0.5);
      border-radius: 20px;
      padding: 10px 20px;
      color: #FF2D78;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
      z-index: 1;
      display: none;
    }
  </style>
</head>
<body>
<div id="map"></div>
<div class="overlay">🎯 AURARUN — PAINT YOUR CITY</div>
<div class="zone-popup" id="zonePopup">🎯 ZONE CAPTURED! +1</div>
<button class="btn" id="startBtn" onclick="toggleRun()">▶ START RUN</button>

<script>
  mapboxgl.accessToken = 'YOUR_MAPBOX_PUBLIC_TOKEN'; // not stored in git

  const map = new mapboxgl.Map({
    container: 'map',
    style: 'mapbox://styles/mapbox/dark-v11',
    center: [75.8577, 22.7196],
    zoom: 15,
    pitch: 45,
    bearing: 0,
  });

  let isRunning = false;

  map.on('load', () => {
    // 3D Buildings
    map.addLayer({
      id: 'buildings-3d',
      source: 'composite',
      'source-layer': 'building',
      type: 'fill-extrusion',
      paint: {
        'fill-extrusion-color': '#1a2035',
        'fill-extrusion-height': ['get', 'height'],
        'fill-extrusion-base': ['get', 'min_height'],
        'fill-extrusion-opacity': 0.7,
      }
    });

    // Load zones from backend
    loadZones();
  });

  async function loadZones() {
    try {
      const res = await fetch('http://localhost:8081/api/map/viewport', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          minLat: 22.6696, maxLat: 22.7696,
          minLng: 75.8077, maxLng: 75.9077
        })
      });
      const zones = await res.json();
      drawZones(zones);
    } catch(e) {
      console.log('Backend not connected:', e);
    }
  }

  function getColor(factionColor) {
    const colors = {
      'PINK': '#FF2D78',
      'BLUE': '#2D8BFF',
      'GREEN': '#2DFF78',
      'ORANGE': '#FF8C2D',
      'PURPLE': '#8C2DFF',
    };
    return colors[factionColor] || '#FFFFFF';
  }

  function drawZones(zones) {
    if (map.getLayer('zones-fill')) map.removeLayer('zones-fill');
    if (map.getLayer('zones-outline')) map.removeLayer('zones-outline');
    if (map.getSource('zones')) map.removeSource('zones');

    const features = zones.map(zone => ({
      type: 'Feature',
      properties: { color: getColor(zone.factionColor) },
      geometry: {
        type: 'Polygon',
        coordinates: [[
          [zone.minLng, zone.minLat],
          [zone.maxLng, zone.minLat],
          [zone.maxLng, zone.maxLat],
          [zone.minLng, zone.maxLat],
          [zone.minLng, zone.minLat],
        ]]
      }
    }));

    map.addSource('zones', {
      type: 'geojson',
      data: { type: 'FeatureCollection', features }
    });

    map.addLayer({
      id: 'zones-fill',
      type: 'fill',
      source: 'zones',
      paint: {
        'fill-color': ['get', 'color'],
        'fill-opacity': 0.45,
      }
    });

    map.addLayer({
      id: 'zones-outline',
      type: 'line',
      source: 'zones',
      paint: {
        'line-color': ['get', 'color'],
        'line-width': 2,
        'line-opacity': 0.9,
      }
    });
  }

  function toggleRun() {
    isRunning = !isRunning;
    const btn = document.getElementById('startBtn');
    if (isRunning) {
      btn.textContent = '⏹ STOP RUN';
      btn.style.background = '#CC1144';
      // Tilt to 60 degrees for game feel
      map.easeTo({ pitch: 60, zoom: 16, duration: 800 });
    } else {
      btn.textContent = '▶ START RUN';
      btn.style.background = '#FF2D78';
      map.easeTo({ pitch: 45, zoom: 15, duration: 800 });
    }
  }

  // Add navigation controls
  map.addControl(new mapboxgl.NavigationControl());
</script>
</body>
</html>
