name: aurarun_app
description: Paint Your City - GPS Territory Game

publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Networking ──────────────────────────────────────────────
  http: ^1.2.0

  # ── Storage ─────────────────────────────────────────────────
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.2.2
  path_provider: ^2.1.4

  # ── Maps ────────────────────────────────────────────────────
  mapbox_maps_flutter: ^2.3.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # ── GPS & Location ───────────────────────────────────────────
  # Tracelet replaces: geolocator + flutter_foreground_task
  # Handles: background GPS, Kalman filter, foreground notification,
  #          motion detection, permission requests
  tracelet: ^1.8.13
  permission_handler: ^11.0.0

  # ── Sensors ─────────────────────────────────────────────────
  pedometer: ^4.0.2

  # ── Media & Sharing ─────────────────────────────────────────
  image_picker: ^1.1.2
  share_plus: ^10.0.0

  # ── Firebase ────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_crashlytics: ^4.1.3
  firebase_analytics: ^11.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true